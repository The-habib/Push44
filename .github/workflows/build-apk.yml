name: Build Push44 Android APK

on:
  push:
    branches: [ "main" ]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile Android Release & Debug APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Signing Keystore
        working-directory: android/app
        run: |
          keytool -genkey -v -keystore release.keystore \
            -alias push44 -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass push44pass -keypass push44pass \
            -dname "CN=Push44, OU=Mobile, O=Push44, L=San Francisco, S=CA, C=US"
          keytool -genkey -v -keystore debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass androiddebugkey -keypass androiddebugkey \
            -dname "CN=Android Debug, O=Android, C=US"

      - name: Build Release APK
        working-directory: android
        run: |
          gradle assembleRelease --stacktrace

      - name: Build Debug APK
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace

      - name: Prepare APK Outputs
        run: |
          mkdir -p build-outputs
          cp android/app/build/outputs/apk/release/app-release.apk build-outputs/Push44-release.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk build-outputs/Push44-debug.apk
          ls -lh build-outputs/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: push44-apks
          path: build-outputs/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: "Push44 Android App v1.0.0"
          body: |
            ## 📱 Push44 Android APK Release v1.0.0
            
            Official Android APK release for **Push44** (https://push44.vercel.app).
            
            ### ✨ Features
            - **Native Android APK** with hardware-accelerated WebView
            - **Direct ZIP File Exports** via Android DownloadManager
            - **Pull-to-refresh & Smooth Navigation**
            - **Edge-to-edge dark theme UI** matching Push44 brand
            - **Zero backend, 100% client-side privacy**
            
            ### 📦 Downloads
            - **Release APK**: `Push44-release.apk` (Recommended)
            - **Debug APK**: `Push44-debug.apk`
          files: |
            build-outputs/Push44-release.apk
            build-outputs/Push44-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

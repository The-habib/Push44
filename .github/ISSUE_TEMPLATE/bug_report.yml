name: 🐛 Bug Report
description: Report an issue or bug with Push44 (Web, Android APK, or CLI)
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with Push44! Please fill in the details below to help us investigate.

  - type: dropdown
    id: platform
    attributes:
      label: Platform / Service Involved
      description: Which AI builder or Push44 surface did you encounter the issue with?
      options:
        - "Base44"
        - "Rocket.new (DhiWise)"
        - "Floot"
        - "Zite"
        - "Framer"
        - "Lovable"
        - "bolt.new"
        - "Push44 Android APK"
        - "Push44 Terminal CLI (p44)"
        - "General Web App (push44.vercel.app)"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description of the Issue
      description: A clear and concise description of what went wrong.
      placeholder: "When attempting to export my project from Base44 to GitHub..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Open push44.vercel.app
        2. Enter Base44 API token
        3. Click 'Fetch Projects'
        4. Select repository and click 'Push to GitHub'
        5. See error message
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: error_logs
    attributes:
      label: Error Messages / Console Logs
      description: Paste any browser console logs, terminal output, or screenshot links (DO NOT include your private API keys or GitHub tokens).
      render: shell

  - type: input
    id: environment
    attributes:
      label: Environment / Device
      description: e.g., Chrome 127 on macOS, Android 14 (Push44 App v1.0.0), Node 20 / Bun 1.1 on Linux
      placeholder: "Chrome 127 on Windows 11 / Android 14"
    validations:
      required: false

name: 💡 Feature Request
description: Propose a new platform integration, export format, or capability for Push44
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Push44 better? We welcome new AI builder integrations, CLI features, and UX improvements!

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      options:
        - "New AI Builder Integration (e.g. Replit, v0, Websim)"
        - "Export Target (e.g. GitLab, Bitbucket, S3)"
        - "Push44 Android APK Feature"
        - "Push44 Terminal CLI Feature"
        - "Diff & Snapshot Tooling"
        - "UI / UX Polish"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives You've Considered
      description: Any alternative solutions or features you've considered.
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or API endpoint documentation if applicable.
    validations:
      required: false
